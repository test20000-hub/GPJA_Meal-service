name: Update school meals

on:
  schedule:
    - cron: '10 18 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch_meals.py'
      - '.github/workflows/update-meals.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Fetch meals
        run: python scripts/fetch_meals.py
      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/meals.json
          git diff --cached --quiet || git commit -m 'chore: update school meals'
          git push
