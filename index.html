<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8fc" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="군포중앙고 급식" />
  <meta name="description" content="군포중앙고등학교 평일 중식 식단을 빠르게 확인하세요." />
  <link rel="manifest" href="manifest.webmanifest?v=20260903-5" />
  <link rel="icon" href="1788425827851.png?v=20260903-5" type="image/png" />
  <link rel="apple-touch-icon" href="1788425827851.png?v=20260903-5" />
  <title>군포중앙고 급식</title>
  <link rel="stylesheet" href="style.css?v=20260903-5" />
</head>
<body>
  <main class="container">
    <header class="header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">GJ</div>
        <div>
          <p class="eyebrow">GUNPO JUNGANG HIGH SCHOOL</p>
          <h1>오늘 뭐 먹지?</h1>
          <p class="sub">군포중앙고 급식을 한눈에 확인하세요.</p>
        </div>
      </div>
      <a class="source" href="https://gpjago.goegu.kr/gpjago/ad/fm/foodmenu/selectFoodMenuView.do?mi=2772" target="_blank" rel="noopener">학교 원본 <span>↗</span></a>
    </header>

    <section class="date-nav" aria-label="날짜 선택">
      <button id="prevBtn" class="icon-btn" aria-label="이전 평일">‹</button>
      <button id="todayBtn" class="today-btn">오늘</button>
      <div class="date-display">
        <span class="date-caption">선택한 날짜</span>
        <strong id="dateLabel">불러오는 중…</strong>
      </div>
      <button id="nextBtn" class="icon-btn" aria-label="다음 평일">›</button>
    </section>

    <section id="mealCard" class="meal-card loading" aria-live="polite">
      <div class="card-orb orb-one"></div>
      <div class="card-orb orb-two"></div>
      <div class="card-top">
        <span class="date-chip"><span class="dot"></span><span id="dayLabel">—</span></span>
        <span id="kcal" class="kcal">—</span>
      </div>
      <div class="meal-heading">
        <span class="meal-badge">LUNCH</span>
        <h2 id="mealTitle">급식을 불러오는 중입니다</h2>
        <p class="meal-note">오늘의 메뉴를 확인해 보세요.</p>
      </div>
      <ul id="menuList" class="menu-list"></ul>
      <p id="emptyMessage" class="empty hidden">이 날짜에는 등록된 급식이 없습니다.</p>
    </section>

    <section class="week-section">
      <div class="section-title">
        <div>
          <p class="section-kicker">WEEKLY MENU</p>
          <h2>이번 주 급식</h2>
        </div>
        <span id="weekLabel"></span>
      </div>
      <div id="weekList" class="week-list"></div>
    </section>

    <footer>
      <p>군포중앙고등학교 공개 식단 기준 · 평일 중식</p>
      <p id="updatedAt"></p>
    </footer>
  </main>
  <script src="app.js?v=20260903-5"></script>
  <script>
    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js?v=20260903-5'));
  </script>
</body>
</html>
